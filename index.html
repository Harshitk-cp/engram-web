        <h1>Engram — Persistent Cognitive Memory for AI Agents</h1>
        <p>Engram is open-source cognitive memory infrastructure for AI agents that learn and improve from experience. Store, recall, and evolve typed memories via a simple HTTP API. Memories strengthen with use, decay when forgotten, and update from feedback — just like the human mind.</p>

        <h2>Four Memory Systems Inspired by Cognitive Science</h2>
        <p>Engram implements four distinct memory types based on established cognitive science research:</p>
        <ul>
          <li><strong>Semantic Memory</strong> — Persistent facts, preferences, beliefs, and decisions. Confidence-scored and typed.</li>
          <li><strong>Episodic Memory</strong> — Rich records of past interactions with full context, emotions, entities, and outcomes.</li>
          <li><strong>Procedural Memory</strong> — Learned skills as trigger-action patterns extracted from successful episodes.</li>
          <li><strong>Working Memory</strong> — 7-slot active memory for current goals and reasoning state, mirroring human working memory.</li>
        </ul>

        <h2>Key Features</h2>
        <ul>
          <li><strong>Confidence-Based Memory Tiering</strong> — Hot memories auto-inject into agent prompts. Cold memories surface only when relevant. Archives decay gracefully.</li>
          <li><strong>Belief Dynamics</strong> — Bayesian log-odds confidence updates. Reinforced memories grow stronger. Contradicted ones weaken. Unused ones decay.</li>
          <li><strong>Hybrid Retrieval</strong> — Every recall combines vector similarity with knowledge graph traversal up to 2 hops deep.</li>
          <li><strong>Conversation Extraction</strong> — Automatically extract and classify memories from conversation transcripts.</li>
          <li><strong>Procedural Learning</strong> — Agents learn reusable skills from successful interactions.</li>
          <li><strong>Metacognition</strong> — Agents assess their own knowledge quality, detect gaps, and flag uncertainty.</li>
          <li><strong>Multi-LLM Support</strong> — OpenAI, Anthropic Claude, Google Gemini, Cerebras.</li>
          <li><strong>40+ REST API Endpoints</strong> — Comprehensive API for all memory operations.</li>
          <li><strong>Sub-10ms Recall Latency</strong> — p95 latency under 10 milliseconds.</li>
        </ul>

        <h2>Who Is Engram For?</h2>
        <ul>
          <li><strong>AI Agent Developers</strong> — Building agents that need persistent memory across sessions.</li>
          <li><strong>LLM App Builders</strong> — Products needing user context beyond a single conversation.</li>
          <li><strong>Multi-Agent Systems</strong> — Shared memory with automatic conflict resolution.</li>
          <li><strong>Research Teams</strong> — Cognitive architectures based on CoALA, Mem0, ACT-R, MUSE.</li>
        </ul>

        <h2>Tech Stack</h2>
        <p>Built with Go (single binary), PostgreSQL, pgvector, and Docker. Self-hosted with one-command deployment.</p>

        <h2>Open Source</h2>
        <p>Engram is fully open source under the Apache-2 License. <a href="https://github.com/Harshitk-cp/engram">View on GitHub</a>.</p>
