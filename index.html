        <h1>Hakuya — Provable Memory Infrastructure for AI Agents</h1>
        <p>Hakuya is open-source agent memory you can prove. Every other memory layer asks you to trust a black box: Hakuya records where each belief came from, lets it decay when it goes stale, can erase any subject on request, and writes every change to a tamper-evident audit trail — so you can prove what your agent knows, and why.</p>

        <h2>Trust &amp; Governance</h2>
        <ul>
          <li><strong>Write-Provenance on Every Belief</strong> — Each memory carries its source, evidence type, and confidence, so you can always answer why the agent holds a belief.</li>
          <li><strong>Tamper-Evident Audit Trail</strong> — Every change (created, reinforced, contradicted, redacted, erased) is appended to a per-tenant SHA-256 hash-chained log. Verify the whole chain in one call; export a signed record for SOC 2 / HIPAA review.</li>
          <li><strong>Verified Per-Subject Erasure</strong> — Cryptographically shred everything about one customer, patient, or guest while keeping a provable record of the erasure. Built for GDPR Article 17 and the EU AI Act.</li>
          <li><strong>Self-Cleaning Memory</strong> — Stale beliefs lose confidence; redundant ones suppress each other through competition-aware decay. Other stores accumulate junk; Hakuya's memory stays clean on its own.</li>
        </ul>

        <h2>The Cognitive Engine Underneath</h2>
        <ul>
          <li><strong>Four Memory Types</strong> — Semantic (facts, preferences), episodic (experiences with outcomes), procedural (learned skills), and working memory (active context).</li>
          <li><strong>Belief Dynamics</strong> — Log-odds confidence updates: reinforced memories strengthen, contradicted ones weaken, unused ones decay. Confidence-based tiering auto-injects hot memories into agent context.</li>
          <li><strong>Contradiction Detection</strong> — Conflicting beliefs are detected and resolved: demoted, archived as superseded, or kept as contextual variants.</li>
          <li><strong>Hybrid Retrieval</strong> — Vector similarity plus knowledge-graph traversal up to 2 hops, ranked by relevance, recency, and confidence. Sub-10ms p95 recall.</li>
          <li><strong>Multi-Subject Isolation</strong> — One agent serves thousands of isolated end-subjects via anchors, sessions, and shared canon memory, with per-subject GDPR purge.</li>
          <li><strong>Conversation Extraction</strong> — Automatically extract and classify memories from transcripts. Multi-LLM: OpenAI, Anthropic Claude, Google Gemini, Cerebras.</li>
        </ul>

        <h2>Benchmark</h2>
        <p>LongMemEval (ICLR 2025): 91.4% overall accuracy with a reproducible public harness — knowledge update 100%, abstention 100%, multi-session 90.2%, temporal reasoning 82.3%.</p>

        <h2>Who Is Hakuya For?</h2>
        <ul>
          <li><strong>Agent &amp; Copilot Builders</strong> — Anyone building AI agents, assistants, or copilots — in code or on an agentic / no-code platform — whose mistakes cost money.</li>
          <li><strong>Regulated Industries</strong> — Health, finance, and legal teams that need auditable agent memory.</li>
          <li><strong>Multi-Subject B2B</strong> — One support, clinical, or concierge agent serving thousands of isolated end-users.</li>
          <li><strong>LLM App Builders</strong> — Persistent, trustworthy user context beyond a single session.</li>
        </ul>

        <h2>Integration &amp; Tech Stack</h2>
        <p>REST API, Python SDK (pip install engram.to), LangChain integration (pip install langchain-engram), and an MCP server for Claude Desktop, Claude Code, Cursor, and Windsurf. Built with Go (single binary), PostgreSQL, pgvector, and Docker — self-hosted with one command.</p>

        <h2>Open Source</h2>
        <p>Hakuya is fully open source under the Apache-2.0 License. <a href="https://github.com/Harshitk-cp/engram">View on GitHub</a>. LLM-readable context: <a href="https://hakuya.ai/llms.txt">llms.txt</a> and <a href="https://hakuya.ai/llms-full.txt">llms-full.txt</a>.</p>
